<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1726" />
    <meta
      name="description"
      content="Slide Rush — an endless water-slide runner in your browser."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Slide Rush</title>
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <canvas id="game-canvas"></canvas>
        <div id="hud">
          <span class="badge" id="hud-left">Slide Rush</span>
          <span class="badge" id="hud-right"></span>
        </div>
        <div id="debug"></div>
        <div id="message"><span id="message-text"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
