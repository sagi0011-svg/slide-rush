<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b2140" />
    <meta
      name="description"
      content="Slide Rush — an endless water-slide runner in your browser."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Slide Rush</title>
    <!--
      The pixel UI font (docs/ART-AND-SHOP.md section 1). Everything else in
      the game is drawn in code, but a typeface is the one thing worth taking
      off the shelf; this one is OFL-licensed and listed in ASSETS.md. With
      display=swap the game still opens if it cannot be fetched, falling back
      to the monospace stack in styles.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <canvas id="game-canvas"></canvas>
        <div id="hud">
          <div class="hud-side">
            <span class="score" data-hud="score">0</span>
            <span class="best" data-hud="best"></span>
          </div>
          <div class="hud-side hud-right">
            <span class="coins" data-hud="coins"></span>
            <span class="multiplier" data-hud="multiplier"></span>
          </div>
        </div>
        <div id="powerups" data-hud="powerups"></div>

        <button id="pause-button" type="button" aria-label="Pause">
          <span></span><span></span>
        </button>

        <div id="tutorial" hidden>
          <p id="tutorial-text"></p>
          <button id="tutorial-skip" type="button"></button>
        </div>

        <!-- Under the screens, so it can never cover a button on them. -->
        <div id="debug"></div>

        <div id="screens">
          <section id="screen-start" class="screen" hidden>
            <!-- The coins in hand, top right (docs/ART-AND-SHOP.md section 3). -->
            <p id="start-coins" class="coin-balance"><i class="coin-icon"></i><span></span></p>
            <h1 id="start-title"></h1>
            <p id="start-tagline" class="muted"></p>
            <!-- The equipped rider, idling. Drawn by src/ui/shop.ts. -->
            <canvas id="start-rider" class="rider-canvas"></canvas>
            <p id="start-best" class="stat"></p>
            <button id="start-play" class="primary" type="button"></button>
            <button id="start-shop" class="ghost" type="button"></button>
            <button id="start-sound" class="ghost" type="button"></button>
            <button id="start-effects" class="ghost" type="button"></button>
          </section>

          <section id="screen-paused" class="screen" hidden>
            <h2 id="paused-title"></h2>
            <button id="paused-resume" class="primary" type="button"></button>
            <button id="paused-restart" class="ghost" type="button"></button>
            <button id="paused-sound" class="ghost" type="button"></button>
            <button id="paused-effects" class="ghost" type="button"></button>
            <button id="paused-home" class="ghost" type="button"></button>
          </section>

          <section id="screen-over" class="screen" hidden>
            <h2 id="over-title"></h2>
            <p id="over-newbest" class="badge-new" hidden></p>
            <dl class="results">
              <div>
                <dt id="over-score-label"></dt>
                <dd id="over-score"></dd>
              </div>
              <div>
                <dt id="over-coins-label"></dt>
                <dd id="over-coins"></dd>
              </div>
              <div>
                <dt id="over-total-label"></dt>
                <dd id="over-total"></dd>
              </div>
              <div>
                <dt id="over-best-label"></dt>
                <dd id="over-best"></dd>
              </div>
            </dl>
            <button id="over-again" class="primary" type="button"></button>
            <button id="over-shop" class="ghost" type="button"></button>
            <button id="over-home" class="ghost" type="button"></button>
          </section>

          <!--
            The shop (docs/ART-AND-SHOP.md section 3). Everything inside is
            filled in and wired up by src/ui/shop.ts; the cards themselves are
            built from the catalog in src/game/shop.ts.
          -->
          <section id="screen-shop" class="screen" hidden>
            <header class="shop-bar">
              <button id="shop-back" class="ghost shop-back" type="button"></button>
              <h2 id="shop-title"></h2>
              <p id="shop-coins" class="coin-balance"><i class="coin-icon"></i><span></span></p>
            </header>

            <div id="shop-tabs" class="shop-tabs"></div>

            <div class="shop-detail">
              <canvas id="shop-preview" class="rider-canvas"></canvas>
              <div class="shop-detail-text">
                <p id="shop-name"></p>
                <p id="shop-price"></p>
                <button id="shop-action" class="primary" type="button"></button>
                <div id="shop-confirm" class="shop-confirm" hidden>
                  <p id="shop-confirm-text"></p>
                  <button id="shop-confirm-yes" class="primary" type="button"></button>
                  <button id="shop-confirm-no" class="ghost" type="button"></button>
                </div>
              </div>
              <!-- Where the coins of a purchase fly out of. -->
              <div id="shop-burst" class="shop-burst" aria-hidden="true"></div>
            </div>

            <div id="shop-grid" class="shop-grid"></div>
          </section>
        </div>
        <div id="flash"></div>
        <div id="message"><span id="message-text"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
