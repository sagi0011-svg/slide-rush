<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1726" />
    <meta
      name="description"
      content="Slide Rush — an endless water-slide runner in your browser."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Slide Rush</title>
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <canvas id="game-canvas"></canvas>
        <div id="hud">
          <div class="hud-side">
            <span class="score" data-hud="score">0</span>
            <span class="best" data-hud="best"></span>
          </div>
          <div class="hud-side hud-right">
            <span class="coins" data-hud="coins"></span>
            <span class="multiplier" data-hud="multiplier"></span>
          </div>
        </div>
        <div id="powerups" data-hud="powerups"></div>

        <button id="pause-button" type="button" aria-label="Pause">
          <span></span><span></span>
        </button>

        <div id="tutorial" hidden>
          <p id="tutorial-text"></p>
          <button id="tutorial-skip" type="button"></button>
        </div>

        <div id="screens">
          <section id="screen-start" class="screen" hidden>
            <h1 id="start-title"></h1>
            <p id="start-tagline" class="muted"></p>
            <p id="start-best" class="stat"></p>
            <button id="start-play" class="primary" type="button"></button>
            <button id="start-sound" class="ghost" type="button"></button>
            <button id="start-effects" class="ghost" type="button"></button>
          </section>

          <section id="screen-paused" class="screen" hidden>
            <h2 id="paused-title"></h2>
            <button id="paused-resume" class="primary" type="button"></button>
            <button id="paused-restart" class="ghost" type="button"></button>
            <button id="paused-sound" class="ghost" type="button"></button>
            <button id="paused-effects" class="ghost" type="button"></button>
            <button id="paused-home" class="ghost" type="button"></button>
          </section>

          <section id="screen-over" class="screen" hidden>
            <h2 id="over-title"></h2>
            <p id="over-newbest" class="badge-new" hidden></p>
            <dl class="results">
              <div>
                <dt id="over-score-label"></dt>
                <dd id="over-score"></dd>
              </div>
              <div>
                <dt id="over-coins-label"></dt>
                <dd id="over-coins"></dd>
              </div>
              <div>
                <dt id="over-best-label"></dt>
                <dd id="over-best"></dd>
              </div>
            </dl>
            <button id="over-again" class="primary" type="button"></button>
            <button id="over-home" class="ghost" type="button"></button>
          </section>
        </div>
        <div id="flash"></div>
        <div id="debug"></div>
        <div id="message"><span id="message-text"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
